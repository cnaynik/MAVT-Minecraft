<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Server Status</title>
  <meta name="description" content="Live-Status der Minecraft-Server">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Server-Status</p>
      <h1 id="site-name">Minecraft</h1>
      <p id="site-tagline" class="tagline"></p>
      <p class="summary" id="summary" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <section id="news" class="news" aria-labelledby="h-news" hidden>
      <h2 id="h-news" class="section-title">News</h2>
      <div id="news-list" class="news-list"></div>
    </section>

    <section aria-labelledby="h-servers">
      <h2 id="h-servers" class="section-title">Server</h2>
      <div id="servers" class="grid">
        <p class="empty">Server werden geladen …</p>
      </div>
    </section>
  </main>

  <dialog id="info-dialog" class="rulebook-dialog" aria-labelledby="dialog-title">
    <div class="rulebook-head">
      <h2 id="dialog-title" class="dialog-title rulebook-title"></h2>
      <button type="button" class="btn btn-ghost dialog-close rulebook-close" aria-label="Fenster schliessen">Schliessen</button>
    </div>
    <div class="dialog-intro rulebook-intro"></div>
    <div class="dialog-body"></div>
  </dialog>

  <footer class="wrap footer">
    <span id="updated"> </span>
    <span>Server Status via <a href="https://mc.willisch.xyz:8443/status" target="_blank" rel="noopener">Crafty</a></span>
  </footer>

  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
