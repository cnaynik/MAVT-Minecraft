<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Server Status</title>
  <meta name="description" content="Live-Status der Minecraft-Server">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Server-Status</p>
      <h1 id="site-name">Minecraft</h1>
      <p id="site-tagline" class="tagline"></p>
      <p class="summary" id="summary" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="h-servers">
      <h2 id="h-servers" class="section-title">Server</h2>
      <div id="servers" class="grid">
        <p class="empty">Server werden geladen …</p>
      </div>
    </section>

    <div class="info-grid">
      <section id="whitelist" class="panel" aria-labelledby="h-whitelist" hidden>
        <h2 id="h-whitelist">Whitelist</h2>
        <p id="whitelist-intro"></p>
        <ol id="whitelist-steps" class="steps"></ol>
        <div id="whitelist-buttons" class="btn-row"></div>
      </section>

      <section id="rules" class="panel" aria-labelledby="h-rules" hidden>
        <h2 id="h-rules">Regeln</h2>
        <ul id="rules-list" class="rules"></ul>
      </section>
    </div>
  </main>

  <footer class="wrap footer">
    <span id="updated">–</span>
    <span>Live-Daten via <a href="https://mcsrvstat.us" rel="noopener">mcsrvstat.us</a></span>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
